services:
  # ─── Backend Service ─────────────────────────────────────────────
  - type: web
    name: soundstream-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set to your frontend Render URL e.g. https://soundstream.onrender.com
      - key: UPLOAD_SECURITY_PIN
        sync: false          # Set this manually in Render dashboard

  # ─── Frontend Static Site ─────────────────────────────────────────
  - type: static
    name: soundstream-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend Render URL e.g. https://soundstream-backend.onrender.com
      - key: VITE_BACKEND_URL
        sync: false          # Same as VITE_API_URL (for Socket.io connection)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # SPA fallback – always serve index.html for React Router
